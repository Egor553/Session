<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Запись на сессию</title>
    
    <!-- Внешние зависимости -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>

    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spinner { animation: spin 1s linear infinite; }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        body { background-color: #ffffff; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #111827; }
        
        input::placeholder { color: #9ca3af; font-weight: 500; }
        
        /* Принудительный черный цвет для всех инпутов */
        input { color: #111827 !important; }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyJQ1omQEi6ZDm7FIVG_NGkRcFaNFxR7NzFxY0_5GtHdhsaIdDaCDn2z5IqDBvk7GXqUw/exec';

        const Screen = {
            CITY_SELECT: 'CITY_SELECT',
            CALENDAR: 'CALENDAR',
            BOOKING_FORM: 'BOOKING_FORM',
            ADMIN: 'ADMIN',
        };

        const api = {
            async getSlots() {
                try {
                    const res = await fetch(`${SCRIPT_URL}?action=getSlots`);
                    const data = await res.json();
                    return data.slots || {};
                } catch (e) { return {}; }
            },
            async saveSlots(slots) {
                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ slots, action: 'saveSlots' }),
                    });
                    return res.ok;
                } catch (e) { return false; }
            },
            async createBooking(booking) {
                try {
                    const params = new URLSearchParams();
                    params.append('action', 'createBooking');
                    Object.entries(booking).forEach(([k, v]) => params.append(k, String(v)));
                    const res = await fetch(SCRIPT_URL, { method: 'POST', body: params });
                    return res.ok;
                } catch (e) { return false; }
            }
        };

        const Spinner = ({ size = 'md', color = 'blue' }) => {
            const sizes = { sm: 'w-4 h-4 border-2', md: 'w-8 h-8 border-4', lg: 'w-12 h-12 border-4' };
            const colorClass = color === 'blue' ? 'border-blue-500/20 border-t-blue-500' : 'border-white/20 border-t-white';
            return <div className={`${sizes[size] || sizes.md} ${colorClass} rounded-full animate-spinner mx-auto`}></div>;
        };

        const Header = ({ title, onBack }) => (
            <header className="px-6 py-5 flex items-center bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100">
                {onBack && (
                    <button onClick={onBack} className="mr-4 p-2 -ml-2 text-gray-400 active:scale-90 transition-transform">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M15 19l-7-7 7-7" /></svg>
                    </button>
                )}
                <h1 className="text-xl font-black text-gray-900 tracking-tight truncate">{title}</h1>
            </header>
        );

        const CalendarGrid = ({ availableDates, selectedDate, onDateSelect }) => {
            const [viewDate, setViewDate] = useState(new Date());
            const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
            const daysOfWeek = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();
            const offset = (firstDay === 0 ? 7 : firstDay) - 1;

            const gridDays = [...Array(offset).fill(null), ...Array.from({length: daysInMonth}, (_, i) => i + 1)];

            return (
                <div className="bg-white rounded-3xl border border-gray-100 p-4 shadow-sm space-y-4">
                    <div className="flex items-center justify-between px-2">
                        <h3 className="font-black text-lg text-gray-900">{monthNames[month]} {year}</h3>
                        <div className="flex space-x-2">
                            <button onClick={() => setViewDate(new Date(year, month - 1, 1))} className="p-2 bg-gray-50 rounded-xl"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
                            <button onClick={() => setViewDate(new Date(year, month + 1, 1))} className="p-2 bg-gray-50 rounded-xl"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M9 18l6-6-6-6"/></svg></button>
                        </div>
                    </div>
                    <div className="grid grid-cols-7 gap-1">
                        {daysOfWeek.map(d => <div key={d} className="text-center text-[10px] font-black text-gray-300 uppercase py-2">{d}</div>)}
                        {gridDays.map((day, idx) => {
                            if (day === null) return <div key={`empty-${idx}`} />;
                            const dStr = new Date(year, month, day).toDateString();
                            const available = availableDates.includes(dStr);
                            const selected = selectedDate === dStr;
                            return (
                                <button key={idx} disabled={!available} onClick={() => onDateSelect(dStr)}
                                    className={`relative aspect-square flex items-center justify-center rounded-2xl text-sm font-bold transition-all
                                    ${selected ? 'bg-blue-500 text-white shadow-lg' : available ? 'bg-blue-50 text-blue-600' : 'text-gray-200'}`}>
                                    {day}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [screen, setScreen] = useState(Screen.CITY_SELECT);
            const [allSlots, setAllSlots] = useState({});
            const [city, setCity] = useState('');
            const [date, setDate] = useState(null);
            const [slot, setSlot] = useState(null);
            const [loading, setLoading] = useState(true);
            const [actionLoading, setActionLoading] = useState(false);
            const [isSuccess, setIsSuccess] = useState(false);
            const [cityInput, setCityInput] = useState('');
            const [cityChecked, setCityChecked] = useState(false);
            const [formData, setFormData] = useState({ name: '', phone: '' });

            useEffect(() => {
                if (window.Telegram?.WebApp) {
                    window.Telegram.WebApp.ready();
                    window.Telegram.WebApp.expand();
                }
                api.getSlots().then(data => { setAllSlots(data); setLoading(false); });
            }, []);

            const availableDates = useMemo(() => {
                if (!city || !allSlots[city]) return [];
                return Array.from(new Set(allSlots[city].map(s => new Date(s).toDateString())));
            }, [city, allSlots]);

            const daySlots = useMemo(() => {
                if (!city || !date || !allSlots[city]) return [];
                return allSlots[city].filter(s => new Date(s).toDateString() === date).sort();
            }, [city, date, allSlots]);

            const handleBooking = async () => {
                if (!slot || !formData.name || !formData.phone) return;
                setActionLoading(true);
                const d = new Date(slot);
                const formatted = `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                
                const payload = {
                    type: city === 'online' ? 'Online' : 'Offline',
                    city: city === 'online' ? 'Онлайн' : city,
                    slot: formatted,
                    full_name: formData.name,
                    phone: formData.phone,
                    external_id: window.Telegram?.WebApp?.initDataUnsafe?.user?.id || ''
                };

                const ok = await api.createBooking(payload);
                if (ok) {
                    const updated = { ...allSlots, [city]: allSlots[city].filter(s => s !== slot) };
                    await api.saveSlots(updated);
                    setIsSuccess(true);
                    window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred('success');
                } else {
                    alert("Ошибка при записи. Попробуйте снова.");
                }
                setActionLoading(false);
            };

            if (loading) return <div className="h-screen flex flex-col items-center justify-center bg-white"><Spinner size="lg" /></div>;
            
            if (isSuccess) return (
                <div className="h-screen flex flex-col items-center justify-center p-8 text-center space-y-8 animate-fade-in bg-white">
                    <div className="w-24 h-24 bg-green-500 rounded-[2.5rem] flex items-center justify-center text-white shadow-xl animate-bounce">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4"><polyline points="20 6 9 17 4 12" /></svg>
                    </div>
                    <h2 className="text-3xl font-black text-gray-900">Вы записаны!</h2>
                    <button onClick={() => window.Telegram?.WebApp?.close()} className="w-full py-5 bg-blue-500 text-white rounded-3xl font-black text-xl shadow-lg active:scale-95 transition-all">Завершить</button>
                </div>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col bg-white animate-fade-in">
                    {screen === Screen.CITY_SELECT && (
                        <div className="p-8 flex flex-col items-center justify-center flex-1 space-y-10">
                            <div className="text-center space-y-4">
                                <div className="inline-flex p-6 bg-blue-50 rounded-[2.5rem] text-blue-500 shadow-inner">
                                    <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></svg>
                                </div>
                                <h1 className="text-4xl font-black tracking-tight text-gray-900">Запись на сессию</h1>
                            </div>
                            
                            <div className="w-full space-y-6">
                                {!cityChecked ? (
                                    <div className="space-y-4">
                                        <input type="text" placeholder="Ваш город..." value={cityInput} onChange={e => setCityInput(e.target.value)} 
                                            className="w-full p-6 rounded-3xl bg-gray-50 border-2 border-transparent focus:border-blue-500 text-center font-black text-xl text-gray-900 outline-none transition-all" />
                                        <button onClick={() => {
                                            const input = cityInput.trim().toLowerCase();
                                            if (input === 'admin123') return setScreen(Screen.ADMIN);
                                            const found = Object.keys(allSlots).find(k => k.toLowerCase() === input);
                                            setCity(found || '');
                                            setCityChecked(true);
                                        }} className="w-full py-5 bg-blue-500 text-white rounded-3xl font-black text-xl shadow-xl active:scale-95 transition-all">Найти окна</button>
                                    </div>
                                ) : (
                                    <div className="w-full space-y-4">
                                        {city ? (
                                            <button onClick={() => setScreen(Screen.CALENDAR)} className="w-full p-6 bg-white border-2 border-blue-500 text-blue-600 rounded-3xl font-black flex justify-between items-center shadow-sm">
                                                <span>📍 {city}</span> <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="9 18 15 12 9 6" /></svg>
                                            </button>
                                        ) : <div className="p-6 bg-amber-50 text-amber-700 rounded-3xl font-bold text-center">Окон нет.</div>}
                                        <button onClick={() => { setCity('online'); setScreen(Screen.CALENDAR); }} className="w-full p-6 bg-blue-500 text-white rounded-3xl font-black flex justify-between items-center shadow-xl">
                                            <span>🌐 Онлайн сессия</span> <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="9 18 15 12 9 6" /></svg>
                                        </button>
                                        <button onClick={() => setCityChecked(false)} className="w-full py-4 text-xs font-black text-gray-300 uppercase tracking-widest text-center">Сменить город</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {screen === Screen.CALENDAR && (
                        <div className="flex flex-col flex-1">
                            <Header title="Выберите день" onBack={() => setScreen(Screen.CITY_SELECT)} />
                            <div className="p-6 space-y-6 flex-1 overflow-y-auto">
                                <CalendarGrid availableDates={availableDates} selectedDate={date} onDateSelect={d => { setDate(d); setSlot(null); }} />
                                {date && (
                                    <div className="grid grid-cols-3 gap-3 animate-fade-in">
                                        {daySlots.map(s => (
                                            <button key={s} onClick={() => setSlot(s)} 
                                                className={`py-5 rounded-2xl font-black text-lg transition-all ${slot === s ? 'bg-blue-500 text-white shadow-lg' : 'bg-gray-50 text-gray-700'}`}>
                                                {new Date(s).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                            {slot && <div className="p-6 border-t bg-white sticky bottom-0"><button onClick={() => setScreen(Screen.BOOKING_FORM)} className="w-full py-5 bg-blue-500 text-white rounded-3xl font-black text-xl shadow-xl active:scale-95 transition-all">Продолжить</button></div>}
                        </div>
                    )}

                    {screen === Screen.BOOKING_FORM && (
                        <div className="flex flex-col flex-1">
                            <Header title="Контактные данные" onBack={() => setScreen(Screen.CALENDAR)} />
                            <div className="p-8 space-y-6 flex-1">
                                <div className="space-y-4">
                                    <input type="text" placeholder="Ваше имя" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} 
                                        className="w-full p-5 bg-gray-50 rounded-2xl font-black text-gray-900 outline-none border-2 border-transparent focus:border-blue-500 transition-all" />
                                    <input type="tel" placeholder="+7 (___) ___-__-__" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} 
                                        className="w-full p-5 bg-gray-50 rounded-2xl font-black text-gray-900 outline-none border-2 border-transparent focus:border-blue-500 transition-all" />
                                </div>
                                <button onClick={handleBooking} disabled={actionLoading || !formData.name || !formData.phone} className="w-full py-5 bg-blue-600 text-white rounded-3xl font-black text-xl shadow-xl">
                                    {actionLoading ? <Spinner color="white" /> : 'Записаться'}
                                </button>
                            </div>
                        </div>
                    )}

                    {screen === Screen.ADMIN && (
                        <div className="flex flex-col flex-1 bg-gray-50">
                            <Header title="Админ-панель" onBack={() => setScreen(Screen.CITY_SELECT)} />
                            <div className="p-8 space-y-4 overflow-y-auto">
                                <input type="text" placeholder="Город (для оффлайна)" onChange={e => setCity(e.target.value)} className="w-full p-4 rounded-xl text-gray-900 font-bold" />
                                <div className="grid grid-cols-2 gap-2">
                                    <input type="date" id="adminStart" className="p-4 rounded-xl text-gray-900 font-bold" />
                                    <input type="date" id="adminEnd" className="p-4 rounded-xl text-gray-900 font-bold" />
                                </div>
                                <button onClick={async () => {
                                    const start = document.getElementById('adminStart').value;
                                    const end = document.getElementById('adminEnd').value;
                                    if (!start || !end) return alert("Выберите даты");
                                    const generated = [];
                                    let d = new Date(start);
                                    while (d <= new Date(end)) {
                                        const slotDate = new Date(d);
                                        slotDate.setHours(10, 0, 0, 0);
                                        generated.push(slotDate.toISOString());
                                        d.setDate(d.getDate() + 1);
                                    }
                                    const updated = { ...allSlots, [city || 'online']: [...(allSlots[city || 'online'] || []), ...generated] };
                                    const ok = await api.saveSlots(updated);
                                    if (ok) { setAllSlots(updated); setScreen(Screen.CITY_SELECT); alert("Слоты добавлены (10:00)"); }
                                }} className="w-full py-4 bg-black text-white rounded-2xl font-black">Сгенерировать (на 10:00)</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
