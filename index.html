<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на сессию</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 50px 40px;
            text-align: center;
        }
        h1 { font-size: 36px; color: #2c3e50; margin-bottom: 40px; font-weight: 700; }
        label { display: block; margin: 25px 0 10px; font-weight: 600; color: #34495e; font-size: 18px; text-align: left; }
        input[type="text"], input[type="tel"], input[type="email"] {
            width: 100%; padding: 18px; border: 2px solid #e0e0e0; border-radius: 16px; font-size: 18px; box-sizing: border-box; transition: all 0.3s;
        }
        input:focus { outline: none; border-color: #3498db; box-shadow: 0 0 15px rgba(52,152,219,0.3); }
        button {
            padding: 18px 32px; background: #3498db; color: white; border: none; border-radius: 16px; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.3s; margin: 10px 5px; box-shadow: 0 8px 20px rgba(52,152,219,0.2);
        }
        button:hover { background: #2980b9; transform: translateY(-3px); }
        .message { padding: 30px; border-radius: 20px; margin: 40px 0; font-size: 22px; font-weight: 600; line-height: 1.6; }
        .congrats { background: linear-gradient(135deg, #d5f5e3, #a8e6cf); color: #27ae60; }
        .no-offline { background: linear-gradient(135deg, #fffacd, #ffeb99); color: #f39c12; }

        /* Календарь */
        #calendar-container { display: none; margin-top: 50px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 24px; font-weight: 700; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; text-align: center; }
        .calendar-day-name { font-weight: 600; color: #34495e; padding: 10px; }
        .calendar-day { padding: 15px; border-radius: 12px; cursor: pointer; transition: all 0.3s; background: #f8f9fa; }
        .calendar-day:hover { background: #e0e7ff; }
        .calendar-day.has-slots { background: #d0ebff; border: 2px solid #3498db; font-weight: 700; color: #2c3e50; }
        .calendar-day.other-month { color: #bdc3c7; }
        #time-slots { margin-top: 40px; display: none; }
        .time-slot-btn { display: inline-block; padding: 15px 25px; margin: 10px; background: #e8f4fd; border: 2px solid #3498db; border-radius: 16px; cursor: pointer; font-weight: 700; color: #2c3e50; font-size: 20px; transition: all 0.3s; }
        .time-slot-btn:hover { background: #3498db; color: white; }

        #booking-form { display: none; margin-top: 70px; padding: 50px; background: linear-gradient(135deg, #f8f9fa, #e9ecef); border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        #online-btn { width: 100%; background: linear-gradient(135deg, #27ae60, #2ecc71); font-size: 22px; padding: 22px; display: none; }
        
        #confirmation-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 10000; }
        #confirmation-content { background: white; border-radius: 24px; padding: 40px; max-width: 600px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.3); }
        #confirmation-content h2 { color: #27ae60; }
        #confirmation-content p { font-size: 20px; line-height: 1.6; margin: 15px 0; }
        #confirmation-close { background: #3498db; margin-top: 30px; padding: 15px 40px; }
        #to-bot-btn { background: linear-gradient(135deg, #27ae60, #2ecc71); margin-top: 20px; padding: 15px 40px; }

        /* Админ-панель */
        #admin-fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 20px; box-sizing: border-box; }
        #admin-content { background: white; border-radius: 24px; padding: 50px; width: 100%; max-width: 900px; max-height: 90vh; overflow-y: auto; box-shadow: 0 30px 60px rgba(0,0,0,0.3); }
        #admin-back { position: absolute; top: 30px; left: 30px; background: #e74c3c; padding: 15px 30px; font-size: 18px; }
        .admin-group { margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Запись на сессию</h1>

        <label for="city-input">В каком городе вы находитесь?</label>
        <input type="text" id="city-input" placeholder="Например: Москва, Уфа, Казань">

        <button onclick="checkCity()">Проверить наличие сессии</button>

        <div id="result-message" class="message" style="display:none;"></div>
        <button id="online-btn">Записаться на онлайн-сессию</button>

        <div id="calendar-container">
            <div class="calendar-header">
                <button onclick="prevMonth()">←</button>
                <span id="month-year"></span>
                <button onclick="nextMonth()">→</button>
            </div>
            <div class="calendar-grid">
                <div class="calendar-day-name">Пн</div>
                <div class="calendar-day-name">Вт</div>
                <div class="calendar-day-name">Ср</div>
                <div class="calendar-day-name">Чт</div>
                <div class="calendar-day-name">Пт</div>
                <div class="calendar-day-name">Сб</div>
                <div class="calendar-day-name">Вс</div>
            </div>
            <div id="calendar-days" class="calendar-grid"></div>

            <div id="time-slots">
                <h3>Доступное время на <span id="selected-date-text"></span></h3>
                <div id="time-buttons"></div>
            </div>
        </div>

        <div id="booking-form">
            <h3>Запись на <span id="selected-slot"></span></h3>
            
            <label for="full_name">Имя и фамилия *</label>
            <input type="text" id="full_name" placeholder="Иванов Иван">

            <label for="phone">Телефон *</label>
            <input type="tel" id="phone" placeholder="+7 (999) 123-45-67">

            <label for="email">Email (не обязательно)</label>
            <input type="email" id="email" placeholder="example@mail.ru">

            <button onclick="submitBooking()">Записаться</button>
        </div>
    </div>

    <div id="confirmation-modal">
        <div id="confirmation-content">
            <h2>🥳 Вы успешно записаны!</h2>
            <p><strong>Дата и время:</strong> <span id="confirm-slot"></span></p>
            <p><strong>Имя:</strong> <span id="confirm-name"></span></p>
            <p>Мы отправили подтверждение вам в Telegram!</p>
            <button id="confirmation-close" onclick="closeConfirmation()">Закрыть</button>
            <button id="to-bot-btn" onclick="goToBot()">Вернуться в бот</button>
        </div>
    </div>

    <div id="admin-fullscreen">
        <div id="admin-content">
            <button id="admin-back" onclick="closeAdminFullscreen()">← Назад</button>
            <h2>Админ-панель</h2>

            <div class="admin-group">
                <label>Тип сессии</label>
                <select id="admin-type">
                    <option value="offline">Оффлайн (по городу)</option>
                    <option value="online">Онлайн-сессия</option>
                </select>
            </div>

            <div class="admin-group">
                <label>Город (для оффлайн)</label>
                <input type="text" id="admin-city" placeholder="Москва">
            </div>

            <div class="admin-group">
                <label>Начало серии</label>
                <input type="datetime-local" id="admin-start">
            </div>

            <div class="admin-group">
                <label>Конец серии</label>
                <input type="datetime-local" id="admin-end">
            </div>

            <div class="admin-group">
                <label>Интервал между слотами (минут)</label>
                <select id="admin-interval-minutes">
                    <option value="80">80 минут</option>
                    <option value="90">90 минут</option>
                    <option value="60">60 минут</option>
                    <option value="120">120 минут</option>
                    <option value="30">30 минут</option>
                </select>
            </div>

            <button onclick="addIntervalSlots()">Добавить серию слотов</button>

            <div class="admin-group">
                <label>Одиночный слот</label>
                <input type="datetime-local" id="admin-single">
                <button onclick="addSingleSlot()">Добавить один слот</button>
            </div>

            <button onclick="listAllSlots()">Показать все слоты</button>
            <div id="admin-slots-list" style="margin-top:30px; font-size:15px;"></div>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ------------------ НАСТРОЙКИ ------------------
        const ADMIN_PASSWORD = 'admin123';
        
        // Ключ Salebot (оставляем старый, если он не менялся)
        const SALEBOT_API_KEY = 'b0dc696500931edf20f8395e7986fe02';
        
        // Ссылка на Apps Script ТАБЛИЦЫ СЛОТОВ (База данных времени)
        const SLOTS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzncapqHVS99r6sJuDFqouNErL6owLkwDKr_EYR1TqxCXI2q-26wdjbBq0SphzWC7Go9w/exec';
        
        // --- НОВАЯ ССЫЛКА НА ТАБЛИЦУ ЗАПИСЕЙ (Выгрузка клиентов) ---
        const RECORDS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw9pwZzgQzhZTOKMR6myisXpAioruZfwbf3hSf2-q_hFgXoXWbA0xqDIVD5FFbZx3j6kw/exec';

        // ID таблицы слотов для чтения JSON
        const SLOTS_SHEET_ID = '1Bqq3D0D1FBksioxcNIEQZbQyBXTKfj_KGW_bjpewCFw';
        // -----------------------------------------------

        let config = { slots: { online: [] } };
        let currentMonth = new Date();
        let selectedDate = null;
        let userCity = '';
        let currentType = '';
        let currentKey = '';
        let selectedSlot = null;

        async function loadConfig() {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SLOTS_SHEET_ID}/gviz/tq?tqx=out:json&sheet=Слоты`;
                const response = await fetch(url);
                const text = await response.text();
                const jsonMatch = text.match(/google.visualization.Query.setResponse\(([\s\S]*)\);/);
                if (jsonMatch && jsonMatch[1]) {
                    const data = JSON.parse(jsonMatch[1]);
                    const rows = data.table.rows;
                    if (rows.length > 0 && rows[0].c && rows[0].c[0] && rows[0].c[0].v) {
                        config = JSON.parse(rows[0].c[0].v);
                    }
                }
            } catch (e) { console.log('Ошибка загрузки слотов'); }
        }

        async function saveConfig() {
            const formData = new FormData();
            formData.append('action', 'saveSlots');
            formData.append('data', JSON.stringify(config));
            try { await fetch(SLOTS_SCRIPT_URL, { method: 'POST', body: formData }); } catch (e) {}
        }

        loadConfig();

        function normalize(str) { return str.trim().toLowerCase().replace(/\s+/g, ''); }

        function checkCity() {
            const input = document.getElementById('city-input').value.trim();
            if (input === ADMIN_PASSWORD) {
                document.getElementById('admin-fullscreen').style.display = 'flex';
                listAllSlots();
                return;
            }
            userCity = input;
            if (!userCity) return alert('Введите город');
            
            resetAll();
            const normalizedUser = normalize(userCity);
            let foundKey = Object.keys(config.slots).find(key => normalize(key) === normalizedUser);

            if (foundKey && config.slots[foundKey].length > 0) {
                currentType = 'offline'; currentKey = foundKey;
                showMessage('🎉 В твоём городе есть оффлайн-сессия!', 'congrats');
                document.getElementById('calendar-container').style.display = 'block';
                renderCalendar();
            } else {
                showMessage('Пока что в твоём городе нет оффлайн-сессии 😔', 'no-offline');
                document.getElementById('online-btn').style.display = 'block';
                document.getElementById('online-btn').onclick = () => {
                    currentType = 'online'; currentKey = 'online';
                    resetAll();
                    document.getElementById('calendar-container').style.display = 'block';
                    renderCalendar();
                };
            }
        }

        function resetAll() {
            hideAll();
            selectedDate = null; selectedSlot = null; currentType = ''; currentKey = '';
        }

        function renderCalendar() {
            const daysGrid = document.getElementById('calendar-days');
            daysGrid.innerHTML = '';
            document.getElementById('month-year').textContent = currentMonth.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
            
            const year = currentMonth.getFullYear(), month = currentMonth.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();
            const startDay = firstDay === 0 ? 6 : firstDay - 1;

            for (let i = startDay - 1; i >= 0; i--) {
                const div = document.createElement('div');
                div.className = 'calendar-day other-month';
                div.textContent = daysInPrevMonth - i;
                daysGrid.appendChild(div);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasSlots = config.slots[currentKey]?.some(s => s.startsWith(dateStr));
                const div = document.createElement('div');
                div.className = 'calendar-day' + (hasSlots ? ' has-slots' : '');
                div.textContent = day;
                div.onclick = () => selectDay(dateStr);
                daysGrid.appendChild(div);
            }
        }

        function selectDay(dateStr) {
            selectedDate = dateStr;
            document.getElementById('selected-date-text').textContent = new Date(dateStr).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
            
            const timeButtons = document.getElementById('time-buttons');
            timeButtons.innerHTML = '';
            const daySlots = config.slots[currentKey]?.filter(s => s.startsWith(dateStr)) || [];
            
            if (daySlots.length === 0) timeButtons.innerHTML = '<p>Нет доступного времени</p>';
            
            daySlots.forEach(slot => {
                const btn = document.createElement('button');
                btn.className = 'time-slot-btn';
                btn.textContent = slot.slice(11, 16);
                btn.onclick = () => {
                    selectedSlot = slot;
                    const d = new Date(slot);
                    document.getElementById('selected-slot').textContent = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) + ' в ' + slot.slice(11, 16);
                    document.getElementById('booking-form').style.display = 'block';
                    document.getElementById('full_name').focus();
                };
                timeButtons.appendChild(btn);
            });
            document.getElementById('time-slots').style.display = 'block';
        }

        // --- ГЛАВНАЯ ФУНКЦИЯ ЗАПИСИ (ОБНОВЛЕННАЯ) ---
        async function submitBooking() {
            const full_name = document.getElementById('full_name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();

            if (!full_name || !phone) {
                alert('Заполните обязательные поля!');
                return;
            }

            // 1. Отправка в Salebot (параллельно)
            const salebotPayload = {
                "client_id": tg.initDataUnsafe?.user?.id || phone,
                "message": "ЗАЯВКА_С_САЙТА",
                "variables": {
                    "name": full_name,
                    "phone": phone,
                    "slot": selectedSlot,
                    "city": currentType === 'online' ? 'Онлайн' : userCity
                }
            };
            
            fetch(`https://chatter.salebot.pro/api/${SALEBOT_API_KEY}/callback`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(salebotPayload)
            }).catch(e => console.error('Salebot error:', e));

            // 2. Удаление слота из расписания
            if (config.slots[currentKey]) {
                config.slots[currentKey] = config.slots[currentKey].filter(s => s !== selectedSlot);
                if (config.slots[currentKey].length === 0) delete config.slots[currentKey];
                saveConfig(); // Не ждем await, пусть сохраняется фоном
            }

            // 3. ЗАПИСЬ В ТАБЛИЦУ (Выгрузка)
            // Используем URLSearchParams и no-cors для максимальной надежности
            const params = new URLSearchParams();
            params.append('type', currentType === 'online' ? 'Онлайн' : 'Оффлайн');
            params.append('city', currentType === 'online' ? 'Онлайн' : userCity);
            params.append('slot', selectedSlot);
            params.append('full_name', full_name);
            params.append('phone', phone);
            params.append('email', email || '-');

            fetch(RECORDS_SCRIPT_URL, { 
                method: 'POST', 
                body: params,
                mode: 'no-cors' // Отправляет данные "вслепую", но они точно дойдут
            })
            .then(() => {
                // Показываем окно успеха
                const d = new Date(selectedSlot);
                const formattedSlot = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }) + ' в ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                
                document.getElementById('confirm-slot').textContent = formattedSlot;
                document.getElementById('confirm-name').textContent = full_name;
                
                document.getElementById('booking-form').style.display = 'none';
                document.getElementById('time-slots').style.display = 'none';
                document.getElementById('confirmation-modal').style.display = 'flex';
            })
            .catch(err => {
                alert('Произошла ошибка связи, но заявка скорее всего обработана ботом.');
                console.error(err);
            });
        }

        function closeConfirmation() {
            document.getElementById('confirmation-modal').style.display = 'none';
            resetAll();
            document.getElementById('city-input').focus();
        }
        
        function goToBot() { 
            if(tg) tg.close(); 
            else window.open('https://t.me/sprosiubogdanova', '_blank'); 
        }
        
        function showMessage(text, type) { const m = document.getElementById('result-message'); m.innerHTML = text; m.className = 'message ' + type; m.style.display = 'block'; }
        
        function hideAll() {
            document.getElementById('result-message').style.display = 'none';
            document.getElementById('online-btn').style.display = 'none';
            document.getElementById('calendar-container').style.display = 'none';
            document.getElementById('booking-form').style.display = 'none';
            document.getElementById('time-slots').style.display = 'none';
        }
        function prevMonth() { currentMonth.setMonth(currentMonth.getMonth() - 1); renderCalendar(); }
        function nextMonth() { currentMonth.setMonth(currentMonth.getMonth() + 1); renderCalendar(); }
        
        // Админка
        function closeAdminFullscreen() { document.getElementById('admin-fullscreen').style.display = 'none'; resetAll(); }
        async function addSingleSlot() {
            const dt = document.getElementById('admin-single').value;
            const key = document.getElementById('admin-type').value === 'online' ? 'online' : document.getElementById('admin-city').value;
            if(!dt || !key) return alert('Заполните поля');
            if(!config.slots[key]) config.slots[key] = [];
            config.slots[key].push(dt); config.slots[key].sort();
            await saveConfig(); alert('Добавлено'); listAllSlots();
        }
        async function addIntervalSlots() {
            const startStr = document.getElementById('admin-start').value;
            const endStr = document.getElementById('admin-end').value;
            const key = document.getElementById('admin-type').value === 'online' ? 'online' : document.getElementById('admin-city').value;
            if(!startStr || !endStr || !key) return alert('Заполните поля');
            let cur = new Date(startStr), end = new Date(endStr), min = parseInt(document.getElementById('admin-interval-minutes').value);
            if(!config.slots[key]) config.slots[key] = [];
            while(cur <= end) {
                config.slots[key].push(cur.toISOString().slice(0,16));
                cur = new Date(cur.getTime() + min * 60000);
            }
            config.slots[key] = [...new Set(config.slots[key])].sort();
            await saveConfig(); alert('Добавлено'); listAllSlots();
        }
        function listAllSlots() {
            const d = document.getElementById('admin-slots-list'); d.innerHTML = '';
            for(let k in config.slots) {
                if(config.slots[k].length) {
                    d.innerHTML += `<b>${k}</b><br>`;
                    config.slots[k].forEach(s => d.innerHTML += `${s.replace('T',' ')} <button onclick="removeSlot('${k}','${s}')">X</button><br>`);
                }
            }
        }
        async function removeSlot(k, s) {
            if(confirm('Удалить?')) {
                config.slots[k] = config.slots[k].filter(x => x !== s);
                await saveConfig(); listAllSlots();
            }
        }
        window.onload = () => document.getElementById('city-input').focus();
    </script>
</body>
</html>м
