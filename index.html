<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на сессию</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 50px 40px;
            text-align: center;
        }
        h1 {
            font-size: 36px;
            color: #2c3e50;
            margin-bottom: 40px;
            font-weight: 700;
        }
        label {
            display: block;
            margin: 25px 0 10px;
            font-weight: 600;
            color: #34495e;
            font-size: 18px;
            text-align: left;
        }
        input[type="text"] {
            width: 100%;
            padding: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            font-size: 18px;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 15px rgba(52,152,219,0.3);
        }
        button {
            padding: 18px 32px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 5px;
            box-shadow: 0 8px 20px rgba(52,152,219,0.2);
        }
        button:hover {
            background: #2980b9;
            transform: translateY(-3px);
        }
        .message {
            padding: 30px;
            border-radius: 20px;
            margin: 40px 0;
            font-size: 22px;
            font-weight: 600;
            line-height: 1.6;
        }
        .congrats { background: linear-gradient(135deg, #d5f5e3, #a8e6cf); color: #27ae60; }
        .no-offline { background: linear-gradient(135deg, #fffacd, #ffeb99); color: #f39c12; }

        /* Календарь */
        #calendar-container {
            display: none;
            margin-top: 50px;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 700;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            text-align: center;
        }
        .calendar-day-name {
            font-weight: 600;
            color: #34495e;
            padding: 10px;
        }
        .calendar-day {
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        .calendar-day:hover {
            background: #e0e7ff;
        }
        .calendar-day.has-slots {
            background: #d0ebff;
            border: 2px solid #3498db;
            font-weight: 700;
            color: #2c3e50;
        }
        .calendar-day.other-month {
            color: #bdc3c7;
        }
        #time-slots {
            margin-top: 40px;
            display: none;
        }
        .time-slot-btn {
            display: inline-block;
            padding: 15px 25px;
            margin: 10px;
            background: #e8f4fd;
            border: 2px solid #3498db;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            color: #2c3e50;
            font-size: 20px;
            transition: all 0.3s;
        }
        .time-slot-btn:hover {
            background: #3498db;
            color: white;
        }
        #booking-form {
            display: none;
            margin-top: 70px;
            padding: 50px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        #online-btn {
            width: 100%;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            font-size: 22px;
            padding: 22px;
        }
        #confirmation-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        #confirmation-content {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }
        #confirmation-content h2 {
            color: #27ae60;
        }
        #confirmation-content p {
            font-size: 20px;
            line-height: 1.6;
            margin: 15px 0;
        }
        #confirmation-close {
            background: #3498db;
            margin-top: 30px;
            padding: 15px 40px;
        }

        /* Админ-панель */
        #admin-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
            box-sizing: border-box;
        }
        #admin-content {
            background: white;
            border-radius: 24px;
            padding: 50px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }
        #admin-back {
            position: absolute;
            top: 30px;
            left: 30px;
            background: #e74c3c;
            padding: 15px 30px;
            font-size: 18px;
        }
        .admin-group {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Запись на сессию</h1>

        <label for="city-input">В каком городе вы находитесь?</label>
        <input type="text" id="city-input" placeholder="Например: Москва, Уфа, Казань">

        <button onclick="checkCity()">Проверить наличие сессии</button>

        <div id="result-message" class="message" style="display:none;"></div>
        <button id="online-btn" style="display:none;">Записаться на онлайн-сессию</button>

        <div id="calendar-container">
            <div class="calendar-header">
                <button onclick="prevMonth()">←</button>
                <span id="month-year"></span>
                <button onclick="nextMonth()">→</button>
            </div>
            <div class="calendar-grid">
                <div class="calendar-day-name">Пн</div>
                <div class="calendar-day-name">Вт</div>
                <div class="calendar-day-name">Ср</div>
                <div class="calendar-day-name">Чт</div>
                <div class="calendar-day-name">Пт</div>
                <div class="calendar-day-name">Сб</div>
                <div class="calendar-day-name">Вс</div>
            </div>
            <div id="calendar-days" class="calendar-grid"></div>

            <div id="time-slots">
                <h3>Доступное время на <span id="selected-date-text"></span></h3>
                <div id="time-buttons"></div>
            </div>
        </div>

        <div id="booking-form">
            <h3>Запись на <span id="selected-slot"></span></h3>
            
            <label for="full_name">Имя и фамилия *</label>
            <input type="text" id="full_name" placeholder="Иванов Иван">

            <label for="phone">Телефон *</label>
            <input type="tel" id="phone" placeholder="+7 (999) 123-45-67">

            <label for="email">Email (не обязательно)</label>
            <input type="email" id="email" placeholder="example@mail.ru">

            <button onclick="submitBooking()">Записаться</button>
        </div>
    </div>

    <div id="confirmation-modal">
        <div id="confirmation-content">
            <h2>🥳 Вы успешно записаны!</h2>
            <p><strong>Дата и время:</strong> <span id="confirm-slot"></span></p>
            <p><strong>Имя:</strong> <span id="confirm-name"></span></p>
            <p><strong>Телефон:</strong> <span id="confirm-phone"></span></p>
            <p><strong>Email:</strong> <span id="confirm-email"></span></p>
            <p>Мы скоро свяжемся с вами!</p>
            <button id="confirmation-close" onclick="closeConfirmation()">Закрыть</button>
        </div>
    </div>

    <!-- Админ-панель -->
    <div id="admin-fullscreen">
        <div id="admin-content">
            <button id="admin-back" onclick="closeAdminFullscreen()">← Назад</button>
            <h2>Админ-панель</h2>

            <div class="admin-group">
                <label>Тип сессии</label>
                <select id="admin-type">
                    <option value="offline">Оффлайн (по городу)</option>
                    <option value="online">Онлайн-сессия</option>
                </select>
            </div>

            <div class="admin-group">
                <label>Город (для оффлайн)</label>
                <input type="text" id="admin-city" placeholder="Москва">
            </div>

            <div class="admin-group">
                <label>Начало серии</label>
                <input type="datetime-local" id="admin-start">
            </div>

            <div class="admin-group">
                <label>Конец серии</label>
                <input type="datetime-local" id="admin-end">
            </div>

            <div class="admin-group">
                <label>Интервал между слотами (минут)</label>
                <select id="admin-interval-minutes">
                    <option value="80">80 минут</option>
                    <option value="90">90 минут</option>
                    <option value="60">60 минут</option>
                    <option value="120">120 минут</option>
                    <option value="30">30 минут</option>
                </select>
            </div>

            <button onclick="addIntervalSlots()">Добавить серию слотов</button>

            <div class="admin-group">
                <label>Одиночный слот</label>
                <input type="datetime-local" id="admin-single">
                <button onclick="addSingleSlot()">Добавить один слот</button>
            </div>

            <button onclick="listAllSlots()">Показать все слоты</button>
            <div id="admin-slots-list" style="margin-top:30px; font-size:15px;"></div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'admin123'; // Пароль для входа в админку
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxXsSHntryFKMmR3QH4DfBWBUFMZL_mO0_YG6nUiBLws1pxVh0KA2_HleBUlBH9LtlxSw/exec';

        const SLOTS_SHEET_ID = '1Bqq3D0D1FBksioxcNIEQZbQyBXTKfj_KGW_bjpewCFw';

        let config = { slots: { online: [] } };

        let currentMonth = new Date();
        let selectedDate = null;

        async function loadConfig() {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SLOTS_SHEET_ID}/gviz/tq?tqx=out:json&sheet=Слоты`;
                const response = await fetch(url);
                const text = await response.text();
                const jsonMatch = text.match(/google.visualization.Query.setResponse\(([\s\S]*)\);/);
                if (jsonMatch && jsonMatch[1]) {
                    const data = JSON.parse(jsonMatch[1]);
                    const rows = data.table.rows;
                    if (rows.length > 0 && rows[0].c && rows[0].c[0] && rows[0].c[0].v) {
                        config = JSON.parse(rows[0].c[0].v);
                    }
                }
            } catch (e) {
                console.log('Ошибка загрузки слотов');
            }
        }

        async function saveConfig() {
            const formData = new FormData();
            formData.append('action', 'saveSlots');
            formData.append('data', JSON.stringify(config));

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: formData });
                if (!response.ok) throw new Error();
            } catch (e) {
                alert('Ошибка сохранения слотов');
            }
        }

        loadConfig();

        let userCity = '';
        let currentType = '';
        let currentKey = '';
        let selectedSlot = null;

        function normalize(str) {
            return str.trim().toLowerCase().replace(/\s+/g, '');
        }

        function checkCity() {
            const input = document.getElementById('city-input').value.trim();

            // Вход в админку по паролю
            if (input === ADMIN_PASSWORD) {
                document.getElementById('admin-fullscreen').style.display = 'flex';
                listAllSlots();
                document.getElementById('city-input').value = '';
                return;
            }

            userCity = input;
            if (!userCity) return alert('Введите город');

            resetAll(); // Полная очистка перед новым запросом

            const normalizedUser = normalize(userCity);

            let foundKey = null;
            for (let key in config.slots) {
                if (normalize(key) === normalizedUser && config.slots[key].length > 0) {
                    foundKey = key;
                    break;
                }
            }

            if (foundKey) {
                currentType = 'offline';
                currentKey = foundKey;
                showMessage('Поздравляем! 🎉 В твоём городе есть оффлайн-сессия!', 'congrats');
                document.getElementById('calendar-container').style.display = 'block';
                renderCalendar();
            } else {
                showMessage('Пока что в твоём городе нет оффлайн-сессии 😔', 'no-offline');
                document.getElementById('online-btn').style.display = 'block';
                document.getElementById('online-btn').onclick = startOnlineSession;
            }
        }

        function startOnlineSession() {
            currentType = 'online';
            currentKey = 'online';
            resetAll();
            document.getElementById('calendar-container').style.display = 'block';
            renderCalendar();
        }

        function resetAll() {
            hideAll();
            document.getElementById('city-input').value = '';
            selectedDate = null;
            selectedSlot = null;
            currentType = '';
            currentKey = '';
        }

        function renderCalendar() {
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();

            document.getElementById('month-year').textContent = currentMonth.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            const daysGrid = document.getElementById('calendar-days');
            daysGrid.innerHTML = '';

            const startDay = firstDay === 0 ? 6 : firstDay - 1;
            for (let i = startDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                const div = document.createElement('div');
                div.className = 'calendar-day other-month';
                div.textContent = day;
                daysGrid.appendChild(div);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasSlots = config.slots[currentKey]?.some(s => s.startsWith(dateStr));

                const div = document.createElement('div');
                div.className = 'calendar-day' + (hasSlots ? ' has-slots' : '');
                div.textContent = day;
                div.onclick = () => selectDay(dateStr);
                daysGrid.appendChild(div);
            }

            const totalCells = daysGrid.children.length;
            const remaining = 42 - totalCells;
            for (let day = 1; day <= remaining; day++) {
                const div = document.createElement('div');
                div.className = 'calendar-day other-month';
                div.textContent = day;
                daysGrid.appendChild(div);
            }
        }

        function selectDay(dateStr) {
            selectedDate = dateStr;
            document.getElementById('selected-date-text').textContent = new Date(dateStr).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

            const timeButtons = document.getElementById('time-buttons');
            timeButtons.innerHTML = '';

            const daySlots = config.slots[currentKey]?.filter(s => s.startsWith(dateStr)) || [];

            if (daySlots.length === 0) {
                timeButtons.innerHTML = '<p>Нет доступного времени на этот день</p>';
            } else {
                daySlots.forEach(slot => {
                    const time = slot.slice(11, 16);
                    const btn = document.createElement('button');
                    btn.className = 'time-slot-btn';
                    btn.textContent = time;
                    btn.onclick = () => {
                        selectedSlot = slot;
                        const d = new Date(slot);
                        const formatted = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }) + ' в ' + time;
                        document.getElementById('selected-slot').textContent = formatted;
                        document.getElementById('booking-form').style.display = 'block';
                        document.getElementById('full_name').focus();
                    };
                    timeButtons.appendChild(btn);
                });
            }

            document.getElementById('time-slots').style.display = 'block';
        }

        function prevMonth() {
            currentMonth.setMonth(currentMonth.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentMonth.setMonth(currentMonth.getMonth() + 1);
            renderCalendar();
        }

        async function submitBooking() {
            const full_name = document.getElementById('full_name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();

            if (!full_name || !phone) {
                showMessage('Заполните обязательные поля!', 'error');
                return;
            }

            config.slots[currentKey] = config.slots[currentKey].filter(s => s !== selectedSlot);
            if (config.slots[currentKey].length === 0) delete config.slots[currentKey];
            await saveConfig();

            const d = new Date(selectedSlot);
            const formattedSlot = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }) + ' в ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

            const formData = new FormData();
            formData.append('type', currentType === 'online' ? 'Онлайн' : 'Оффлайн');
            formData.append('city', currentType === 'online' ? 'Онлайн' : userCity);
            formData.append('slot', selectedSlot);
            formData.append('full_name', full_name);
            formData.append('phone', phone);
            formData.append('email', email || '-');
            formData.append('timestamp', new Date().toISOString());

            fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: formData })
                .then(response => {
                    if (response.ok) {
                        document.getElementById('confirm-slot').textContent = formattedSlot;
                        document.getElementById('confirm-name').textContent = full_name;
                        document.getElementById('confirm-phone').textContent = phone;
                        document.getElementById('confirm-email').textContent = email || 'не указан';
                        document.getElementById('confirmation-modal').style.display = 'flex';
                        document.getElementById('booking-form').style.display = 'none';
                        document.getElementById('time-slots').style.display = 'none';
                    } else {
                        alert('Ошибка отправки');
                    }
                })
                .catch(() => alert('Ошибка сети'));
        }

        function closeConfirmation() {
            document.getElementById('confirmation-modal').style.display = 'none';
            resetAll(); // Полная очистка после записи
        }

        function closeAdminFullscreen() {
            document.getElementById('admin-fullscreen').style.display = 'none';
            document.getElementById('city-input').value = '';
            document.getElementById('city-input').focus();
        }

        function showMessage(text, type) {
            const msg = document.getElementById('result-message');
            msg.innerHTML = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
        }

        function hideAll() {
            document.getElementById('result-message').style.display = 'none';
            document.getElementById('online-btn').style.display = 'none';
            document.getElementById('calendar-container').style.display = 'none';
            document.getElementById('booking-form').style.display = 'none';
            document.getElementById('time-slots').style.display = 'none';
        }

        // Админ-функции (добавление слотов)
        async function addSingleSlot() {
            const type = document.getElementById('admin-type').value;
            const cityInput = document.getElementById('admin-city').value.trim();
            const dt = document.getElementById('admin-single').value;
            if (!dt || (type === 'offline' && !cityInput)) return alert('Заполните поля');

            const key = type === 'online' ? 'online' : cityInput;
            if (!config.slots[key]) config.slots[key] = [];
            if (!config.slots[key].includes(dt)) {
                config.slots[key].push(dt);
                config.slots[key].sort();
                await saveConfig();
                alert('Слот добавлен!');
                listAllSlots();
            } else {
                alert('Слот уже существует');
            }
        }

        async function addIntervalSlots() {
            const type = document.getElementById('admin-type').value;
            const cityInput = document.getElementById('admin-city').value.trim();
            const startStr = document.getElementById('admin-start').value;
            const endStr = document.getElementById('admin-end').value;
            const intervalMinutes = parseInt(document.getElementById('admin-interval-minutes').value);

            if (!startStr || !endStr || (type === 'offline' && !cityInput)) {
                return alert('Заполните все поля');
            }

            const key = type === 'online' ? 'online' : cityInput;
            if (!config.slots[key]) config.slots[key] = [];

            let current = new Date(startStr);
            const end = new Date(endStr);

            while (current <= end) {
                const slotStr = current.toISOString().slice(0,16);
                if (!config.slots[key].includes(slotStr)) {
                    config.slots[key].push(slotStr);
                }
                current = new Date(current.getTime() + intervalMinutes * 60000);
            }

            config.slots[key].sort();
            await saveConfig();
            alert(`Добавлено слотов с интервалом ${intervalMinutes} минут!`);
            listAllSlots();
        }

        function listAllSlots() {
            const div = document.getElementById('admin-slots-list');
            div.innerHTML = '<strong>Все слоты:</strong><br><br>';
            for (let key in config.slots) {
                if (config.slots[key].length > 0) {
                    div.innerHTML += `<strong>${key}:</strong><br>`;
                    config.slots[key].forEach(s => {
                        const d = new Date(s);
                        const dateStr = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
                        const timeStr = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                        div.innerHTML += `• ${dateStr} в ${timeStr} <button onclick="removeSlot('${key}','${s}')">Удалить</button><br>`;
                    });
                    div.innerHTML += '<br>';
                }
            }
        }

        async function removeSlot(key, slot) {
            if (confirm('Удалить этот слот?')) {
                config.slots[key] = config.slots[key].filter(s => s !== slot);
                if (config.slots[key].length === 0) delete config.slots[key];
                await saveConfig();
                listAllSlots();
            }
        }
    </script>
</body>
</html>м
