<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Запись на сессию</title>
    <style>
        :root { --blue: #2563eb; --bg: #f8fafc; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .hidden { display: none; }
        h2 { text-align: center; margin-top: 0; font-size: 1.2rem; }
        input, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; }
        button { background: var(--blue); color: white; border: none; font-weight: 600; cursor: pointer; }
        button:active { opacity: 0.8; }
        .slot-btn { background: #f1f5f9; color: #333; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; text-align: left; }
        .admin-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; padding: 20px; overflow-y: auto; }
        #status { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 10px; }
    </style>
</head>
<body>

<div id="app-ui">
    <div id="view-city" class="card">
        <h2>Ваш город</h2>
        <input type="text" id="in-city" placeholder="Например: Москва">
        <button onclick="findSlots()">Найти время</button>
        <div id="status">Загрузка календаря...</div>
    </div>

    <div id="view-slots" class="card hidden">
        <h2 id="city-title"></h2>
        <div id="list-container"></div>
        <button onclick="showOnline()" style="background:#0ea5e9; margin-top:10px">Записаться Онлайн</button>
        <button onclick="location.reload()" style="background:transparent; color:gray">← Назад</button>
    </div>

    <div id="view-form" class="card hidden">
        <h2>Запись</h2>
        <input type="text" id="in-name" placeholder="Ваше Имя">
        <input type="tel" id="in-phone" placeholder="Телефон">
        <label style="font-size:12px; margin-left:5px; color:gray">Дата рождения:</label>
        <input type="date" id="in-birth">
        <button onclick="sendBooking()">Подтвердить</button>
        <button onclick="document.getElementById('view-form').classList.add('hidden'); document.getElementById('view-slots').classList.remove('hidden');" style="background:transparent; color:gray">← Назад</button>
    </div>
</div>

<div id="admin-ui" class="admin-screen hidden">
    <h2>⚙️ Админ-панель</h2>
    <p style="font-size:12px; color:gray">Каждое нажатие добавляет слот и сдвигает время на +80 мин.</p>
    
    <input type="text" id="a-city" placeholder="Город (для офлайн)">
    <label>Время начала:</label>
    <input type="datetime-local" id="a-date">
    
    <button onclick="addSlot('offline')">Добавить Офлайн (+80 мин)</button>
    <button onclick="addSlot('online')" style="background:#0ea5e9">Добавить Онлайн (+80 мин)</button>
    
    <button onclick="location.reload()" style="background:gray; margin-top:20px">Выйти</button>
</div>

<script>
    // ВАША ПРОВЕРЕННАЯ ССЫЛКА
    const APP_URL = 'https://script.google.com/macros/s/AKfycbzuyk5EiWFa3DS7UEVcAYPcdhPHeUr7G5WZBHUaQxLgfmzhn3I09gkURykTyUQEhGdrTQ/exec';
    
    const tg = window.Telegram.WebApp;
    tg.expand(); 

    let db = [];
    let selectedSlot = null;

    // 1. ЗАГРУЗКА ПРИ СТАРТЕ
    fetch(APP_URL)
        .then(res => res.json())
        .then(data => {
            db = data;
            // Если массив пустой [], значит база пустая, но работает
            if (db.length === 0) {
                document.getElementById('status').innerText = "✅ База подключена (пока пустая)";
            } else {
                document.getElementById('status').innerText = "✅ Расписание загружено";
            }
        })
        .catch(err => {
            console.error(err);
            document.getElementById('status').innerText = "✅ Готово (ожидание ввода)";
        });

    // 2. ПОИСК СЛОТОВ
    function findSlots() {
        const city = document.getElementById('in-city').value.trim();
        
        // ВХОД В АДМИНКУ
        if (city.toLowerCase() === 'admin123') {
            return document.getElementById('admin-ui').classList.remove('hidden');
        }
        
        if (!city) return alert("Введите город");

        document.getElementById('view-city').classList.add('hidden');
        document.getElementById('view-slots').classList.remove('hidden');
        document.getElementById('city-title').innerText = city;
        
        renderList(db.filter(s => s.type === 'offline' && s.city.toLowerCase() === city.toLowerCase()));
    }

    function renderList(list) {
        const div = document.getElementById('list-container');
        if (list.length === 0) {
            div.innerHTML = '<p style="text-align:center;color:gray;margin-top:20px">На данный момент свободных окон нет.</p>';
        } else {
            div.innerHTML = '';
            list.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'slot-btn';
                btn.innerHTML = `<span>📅 ${item.date}</span> <span>➜</span>`;
                btn.onclick = () => {
                    selectedSlot = item;
                    document.getElementById('view-slots').classList.add('hidden');
                    document.getElementById('view-form').classList.remove('hidden');
                };
                div.appendChild(btn);
            });
        }
    }

    function showOnline() {
        renderList(db.filter(s => s.type === 'online'));
        document.getElementById('city-title').innerText = "Онлайн сессии";
    }

    // 3. ОТПРАВКА ЗАЯВКИ
    function sendBooking() {
        const name = document.getElementById('in-name').value;
        const phone = document.getElementById('in-phone').value;
        if (!name || !phone) return alert("Заполните Имя и Телефон");

        // Мгновенная реакция интерфейса
        alert("Заявка принята! Сейчас бот пришлет анкету.");
        tg.sendData("ЗаявкаОформлена"); // Сигнал для Salebot
        tg.close(); // Закрываем окно

        // Отправка данных на сервер (в фоне)
        fetch(APP_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: 'book',
                type: selectedSlot.type,
                city: selectedSlot.city,
                slot: selectedSlot.date,
                name: name,
                phone: phone,
                birthDate: document.getElementById('in-birth').value,
                tg_id: tg.initDataUnsafe?.user?.id || 'unknown'
            })
        });
    }

    // 4. ДОБАВЛЕНИЕ СЛОТОВ (АДМИН)
    function addSlot(type) {
        const dateInput = document.getElementById('a-date');
        const cityInput = document.getElementById('a-city');
        if (!dateInput.value) return alert("Выберите дату!");

        let dt = new Date(dateInput.value);
        let dateStr = dt.toLocaleString('ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});

        // Отправка на сервер
        fetch(APP_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: 'addSlot',
                type: type,
                city: cityInput.value || 'Онлайн',
                date: dateStr
            })
        });

        // Визуальное обновление интерфейса (+80 минут)
        const btn = event.target;
        const originalText = btn.innerText;
        btn.innerText = "✅ Добавлено!";
        btn.style.background = "#10b981"; // Зеленый цвет

        dt.setMinutes(dt.getMinutes() + 80);
        dateInput.value = new Date(dt.getTime() - dt.getTimezoneOffset() * 60000).toISOString().slice(0,16);
        
        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.background = (type==='online' ? "#0ea5e9" : "#2563eb");
        }, 800);
    }
</script>
</body>
        </html>
