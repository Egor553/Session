<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
        button { background: #2563eb; color: white; border: none; font-weight: bold; }
        .slot { background: #eef2ff; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #2563eb; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="main" class="card">
    <h2 id="title">Загрузка...</h2>
    <div id="search-box">
        <input type="text" id="city" placeholder="Введите город (Астана)">
        <button onclick="search()">Показать время</button>
    </div>
    <div id="results" class="hidden"></div>
</div>

<div id="form" class="card hidden">
    <h2>Ваши данные</h2>
    <input type="text" id="name" placeholder="Имя">
    <input type="tel" id="phone" placeholder="Телефон">
    <button onclick="book()">Записаться</button>
</div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxxriHN93W03GWL8TdadbjY9-EFDjoGIplBjg_g3xxNw2THFLQfOlPdiglomrr540Qdyg/exec';
    const tg = window.Telegram.WebApp;
    let db = [];
    let selected = null;

    // Функция загрузки с обходом блокировок
    async function load() {
        try {
            const r = await fetch(API_URL);
            db = await r.json();
            document.getElementById('title').innerText = "Ваш город";
        } catch (e) {
            document.getElementById('title').innerText = "Ошибка (попробуйте обновить)";
        }
    }
    load();

    function search() {
        const val = document.getElementById('city').value.trim().toLowerCase();
        if(val === 'admin123') { /* здесь можно открыть админку */ return; }
        
        const found = db.filter(x => x.city.toLowerCase() === val);
        const resDiv = document.getElementById('results');
        resDiv.innerHTML = "";
        resDiv.classList.remove('hidden');

        if(found.length === 0) {
            resDiv.innerHTML = "<p>Мест нет</p>";
        } else {
            found.forEach(s => {
                const d = document.createElement('div');
                d.className = 'slot';
                d.innerText = s.date;
                d.onclick = () => {
                    selected = s;
                    document.getElementById('main').classList.add('hidden');
                    document.getElementById('form').classList.remove('hidden');
                };
                resDiv.appendChild(d);
            });
        }
    }

    async function book() {
        const n = document.getElementById('name').value;
        const p = document.getElementById('phone').value;
        if(!n || !p) return alert("Заполни поля");

        await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: 'book',
                slot: selected.date,
                city: selected.city,
                type: selected.type,
                name: n,
                phone: p,
                tg_id: tg.initDataUnsafe?.user?.id || '0'
            })
        });

        alert("Записано!");
        tg.sendData("ЗаявкаОформлена");
        tg.close();
    }
</script>
</body>
</html>
