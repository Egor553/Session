<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запись на сессию</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--text); -webkit-font-smoothing: antialiased; }
        
        .container { max-width: 480px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; transition: transform 0.2s; }
        .hidden { display: none !important; }
        
        h2 { margin-top: 0; text-align: center; font-size: 1.25rem; color: var(--primary); }
        
        input, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #e2e8f0; font-size: 16px; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--primary); }
        
        button { background: var(--primary); color: white; border: none; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        button:active { opacity: 0.8; transform: scale(0.98); }
        
        /* Кнопки слотов */
        .slot-item { background: #f1f5f9; color: #333; border: 1px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center; text-align: left; }
        .slot-item span:last-child { color: var(--primary); font-weight: bold; }
        
        /* Админка */
        .admin-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        
        .status-text { text-align: center; font-size: 0.8rem; color: #94a3b8; margin-top: 10px; }
        .back-btn { background: transparent; color: #94a3b8; font-weight: normal; margin-top: 0; }
    </style>
</head>
<body>

<div class="container" id="app">
    
    <div id="screen-city" class="card">
        <h2>Ваш город</h2>
        <input type="text" id="input-city" placeholder="Например: Москва">
        <button onclick="handleCitySearch()">Найти свободное время</button>
        <div class="status-text" id="loading-status">Загрузка расписания...</div>
    </div>

    <div id="screen-slots" class="card hidden">
        <h2 id="city-display"></h2>
        <div id="slots-list"></div>
        <button onclick="showOnlineSlots()" style="background:#0ea5e9; margin-top:15px;">Записаться на Онлайн</button>
        <button onclick="location.reload()" class="back-btn">← Вернуться назад</button>
    </div>

    <div id="screen-form" class="card hidden">
        <h2>Заполните данные</h2>
        <p style="text-align:center; font-size:0.9rem; color:#64748b" id="selected-slot-info"></p>
        
        <input type="text" id="user-name" placeholder="Ваше Имя">
        <input type="tel" id="user-phone" placeholder="Телефон">
        <label style="font-size:0.8rem; color:#64748b; margin-left:5px">Дата рождения:</label>
        <input type="date" id="user-birth">
        
        <button onclick="submitBooking()">Подтвердить запись</button>
        <button onclick="goBackToSlots()" class="back-btn">← Отмена</button>
    </div>

</div>

<div id="admin-panel" class="admin-overlay hidden">
    <h2>⚙️ Панель управления</h2>
    <div style="background:#f8fafc; padding:15px; border-radius:10px; margin-bottom:20px; border:1px dashed #cbd5e1;">
        <small style="color:#64748b">Автоматический шаг времени: <b>+80 минут</b></small>
    </div>

    <input type="text" id="admin-city" placeholder="Город (для Офлайн)">
    <label>Время начала первой сессии:</label>
    <input type="datetime-local" id="admin-date">
    
    <button onclick="adminAddSlot('offline')">Добавить Офлайн (+80 мин)</button>
    <button onclick="adminAddSlot('online')" style="background:#0ea5e9">Добавить Онлайн (+80 мин)</button>
    
    <button onclick="location.reload()" style="background:#94a3b8; margin-top:30px">Выйти</button>
</div>

<script>
    // --- КОНФИГУРАЦИЯ ---
    const API_URL = 'https://script.google.com/macros/s/AKfycbzuyk5EiWFa3DS7UEVcAYPcdhPHeUr7G5WZBHUaQxLgfmzhn3I09gkURykTyUQEhGdrTQ/exec';
    
    // Инициализация Telegram Mini App
    const tg = window.Telegram.WebApp;
    tg.expand(); // Растягиваем на весь экран

    let allSlots = [];
    let selectedSlot = null;

    // --- 1. ФОНОВАЯ ЗАГРУЗКА ДАННЫХ ---
    fetch(API_URL)
        .then(response => response.json())
        .then(data => {
            allSlots = data;
            document.getElementById('loading-status').innerText = "✅ Расписание загружено";
        })
        .catch(err => {
            console.error(err);
            document.getElementById('loading-status').innerText = "⚠️ Ошибка соединения";
        });

    // --- 2. ЛОГИКА ПОЛЬЗОВАТЕЛЯ ---
    
    function handleCitySearch() {
        const city = document.getElementById('input-city').value.trim();
        
        // Секретный вход для админа
        if (city.toLowerCase() === 'admin123') {
            document.getElementById('admin-panel').classList.remove('hidden');
            return;
        }

        if (!city) return alert("Введите город");

        // Фильтруем офлайн слоты по городу
        const filtered = allSlots.filter(s => s.type === 'offline' && s.city.toLowerCase() === city.toLowerCase());
        
        document.getElementById('screen-city').classList.add('hidden');
        document.getElementById('screen-slots').classList.remove('hidden');
        document.getElementById('city-display').innerText = "г. " + city;
        
        renderSlots(filtered);
    }

    function showOnlineSlots() {
        const online = allSlots.filter(s => s.type === 'online');
        document.getElementById('city-display').innerText = "Онлайн сессии";
        renderSlots(online);
    }

    function renderSlots(list) {
        const container = document.getElementById('slots-list');
        container.innerHTML = '';
        
        if (list.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#94a3b8; margin:20px 0;">Свободных мест нет</p>';
            return;
        }

        list.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'slot-item';
            btn.innerHTML = `<span>📅 ${item.date}</span> <span>➜</span>`;
            btn.onclick = () => openBookingForm(item);
            container.appendChild(btn);
        });
    }

    function openBookingForm(item) {
        selectedSlot = item;
        document.getElementById('screen-slots').classList.add('hidden');
        document.getElementById('screen-form').classList.remove('hidden');
        document.getElementById('selected-slot-info').innerText = `${item.type.toUpperCase()} • ${item.date}`;
    }

    function goBackToSlots() {
        document.getElementById('screen-form').classList.add('hidden');
        document.getElementById('screen-slots').classList.remove('hidden');
    }

    // --- 3. ОТПРАВКА ЗАПИСИ И СВЯЗЬ С SALEBOT ---
    function submitBooking() {
        const name = document.getElementById('user-name').value;
        const phone = document.getElementById('user-phone').value;
        const birth = document.getElementById('user-birth').value;

        if (!name || !phone) return alert("Пожалуйста, введите Имя и Телефон");

        // 1. Показываем успех клиенту МГНОВЕННО
        alert("Заявка успешно создана! Сейчас бот пришлет вам анкету.");

        // 2. Отправляем данные в Google Таблицу (в фоне)
        const payload = {
            action: 'book',
            type: selectedSlot.type,
            city: selectedSlot.city,
            slot: selectedSlot.date,
            name: name,
            phone: phone,
            birthDate: birth,
            tg_id: tg.initDataUnsafe?.user?.id || 'web_user'
        };

        // Используем простой POST text/plain для гарантии доставки
        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });

        // 3. ОТПРАВЛЯЕМ СИГНАЛ БОТУ И ЗАКРЫВАЕМСЯ
        // Эта команда "триггерит" стрелку в Salebot
        tg.sendData("ЗаявкаОформлена");
        tg.close();
    }

    // --- 4. ЛОГИКА АДМИНА (+80 МИНУТ) ---
    function adminAddSlot(type) {
        const dateInput = document.getElementById('admin-date');
        const cityInput = document.getElementById('admin-city');
        
        if (!dateInput.value) return alert("Выберите дату!");

        let dt = new Date(dateInput.value);
        // Форматируем дату красиво для отображения
        let dateStr = dt.toLocaleString('ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});

        // Отправляем в Google
        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: 'addSlot',
                type: type,
                city: cityInput.value || 'Онлайн',
                date: dateStr
            })
        });

        // АВТОМАТИЧЕСКИЙ СДВИГ ВРЕМЕНИ (+80 МИНУТ)
        dt.setMinutes(dt.getMinutes() + 80);
        
        // Конвертируем обратно в формат для input type="datetime-local"
        // (Учитываем смещение часового пояса, чтобы время не скакало)
        const offset = dt.getTimezoneOffset() * 60000;
        const localISOTime = new Date(dt.getTime() - offset).toISOString().slice(0, 16);
        dateInput.value = localISOTime;

        // Визуальное подтверждение на кнопке
        const btn = event.target;
        const oldText = btn.innerText;
        btn.innerText = "✅ Добавлено!";
        btn.style.background = "#10b981"; // Зеленый цвет
        
        setTimeout(() => {
            btn.innerText = oldText;
            btn.style.background = (type === 'online') ? "#0ea5e9" : "#2563eb";
        }, 800);
    }
</script>

</body>
</html>
