<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на сессию</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 50px 40px;
            text-align: center;
        }
        h1 {
            font-size: 36px;
            color: #2c3e50;
            margin-bottom: 40px;
            font-weight: 700;
        }
        label {
            display: block;
            margin: 25px 0 10px;
            font-weight: 600;
            color: #34495e;
            font-size: 18px;
            text-align: left;
        }
        input[type="text"], input[type="tel"], input[type="email"] {
            width: 100%;
            padding: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            font-size: 18px;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 15px rgba(52,152,219,0.3);
        }
        button {
            padding: 18px 32px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 20px 0;
            box-shadow: 0 8px 20px rgba(52,152,219,0.2);
        }
        button:hover {
            background: #2980b9;
            transform: translateY(-3px);
        }
        .message {
            padding: 30px;
            border-radius: 20px;
            margin: 40px 0;
            font-size: 22px;
            font-weight: 600;
            line-height: 1.6;
        }
        .congrats { background: linear-gradient(135deg, #d5f5e3, #a8e6cf); color: #27ae60; }
        .no-offline { background: linear-gradient(135deg, #fffacd, #ffeb99); color: #f39c12; }
        .success { background: linear-gradient(135deg, #d4edda, #c3e6cb); color: #155724; font-size: 28px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        #slots-container { margin: 60px 0; }
        #slots-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        @media (max-width: 768px) { #slots-list { grid-template-columns: 1fr; } }
        .slot-card {
            background: linear-gradient(135deg, #e8f4fd, #d0ebff);
            border: 3px solid #3498db;
            border-radius: 24px;
            padding: 40px 20px;
            font-weight: 700;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 10px 25px rgba(52,152,219,0.15);
        }
        .slot-card:hover {
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 25px 50px rgba(52,152,219,0.3);
        }
        .slot-date { font-size: 26px; margin-bottom: 15px; }
        .slot-time { font-size: 38px; line-height: 1.2; }
        #booking-form {
            display: none;
            margin-top: 70px;
            padding: 50px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        #online-btn {
            width: 100%;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            font-size: 22px;
            padding: 22px;
        }
        #confirmation-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        #confirmation-content {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }
        #confirmation-content h2 {
            color: #27ae60;
        }
        #confirmation-content p {
            font-size: 20px;
            line-height: 1.6;
            margin: 15px 0;
        }
        #confirmation-close {
            background: #3498db;
            margin-top: 30px;
            padding: 15px 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Запись на сессию</h1>

        <label for="city-input">В каком городе вы находитесь?</label>
        <input type="text" id="city-input" placeholder="Например: Москва, Уфа, Казань">

        <button onclick="checkCity()">Проверить наличие сессии</button>

        <div id="result-message" class="message" style="display:none;"></div>
        <button id="online-btn" style="display:none;">Записаться на онлайн-сессию</button>

        <div id="slots-container" style="display:none;">
            <h2>Выберите удобное время</h2>
            <div id="slots-list"></div>
        </div>

        <div id="booking-form">
            <h3>Запись на <span id="selected-slot"></span></h3>
            
            <label for="full_name">Имя и фамилия *</label>
            <input type="text" id="full_name" placeholder="Иванов Иван">

            <label for="phone">Телефон *</label>
            <input type="tel" id="phone" placeholder="+7 (999) 123-45-67">

            <label for="email">Email (не обязательно)</label>
            <input type="email" id="email" placeholder="example@mail.ru">

            <button onclick="submitBooking()">Записаться</button>
        </div>
    </div>

    <div id="confirmation-modal">
        <div id="confirmation-content">
            <h2>🥳 Вы успешно записаны!</h2>
            <p><strong>Дата и время:</strong> <span id="confirm-slot"></span></p>
            <p><strong>Имя:</strong> <span id="confirm-name"></span></p>
            <p><strong>Телефон:</strong> <span id="confirm-phone"></span></p>
            <p><strong>Email:</strong> <span id="confirm-email"></span></p>
            <p>Мы скоро свяжемся с вами!</p>
            <button id="confirmation-close" onclick="closeConfirmation()">Закрыть</button>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'admin123';
        const SLOTS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxXsSHntryFKMmR3QH4DfBWBUFMZL_mO0_YG6nUiBLws1pxVh0KA2_HleBUlBH9LtlxSw/exec'; // Новый — для слотов (админ)
        const RECORDS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwgF7ZgsAGLSltO33bK_GTD-gyVu28RjDjLwYwAg5Z28oQFK5oC36vRxcxO7jTZ_tHzMw/exec'; // Старый — для записей пользователей

        const SLOTS_SHEET_ID = '1Bqq3D0D1FBksioxcNIEQZbQyBXTKfj_KGW_bjpewCFw';

        let config = { slots: { online: [] } };

        async function loadConfig() {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SLOTS_SHEET_ID}/gviz/tq?tqx=out:json&sheet=Слоты`;
                const response = await fetch(url);
                const text = await response.text();
                const jsonMatch = text.match(/google.visualization.Query.setResponse\(([\s\S]*)\);/);
                if (jsonMatch && jsonMatch[1]) {
                    const data = JSON.parse(jsonMatch[1]);
                    const rows = data.table.rows;
                    if (rows.length > 0 && rows[0].c && rows[0].c[0] && rows[0].c[0].v) {
                        config = JSON.parse(rows[0].c[0].v);
                    }
                }
            } catch (e) {
                console.log('Ошибка загрузки слотов');
            }
        }

        async function saveConfig() {
            const formData = new FormData();
            formData.append('action', 'saveSlots');
            formData.append('data', JSON.stringify(config));

            try {
                const response = await fetch(SLOTS_SCRIPT_URL, { method: 'POST', body: formData });
                if (!response.ok) throw new Error();
            } catch (e) {
                alert('Ошибка сохранения слотов');
            }
        }

        loadConfig();

        let userCity = '';
        let currentType = '';
        let currentKey = '';
        let selectedSlot = null;

        function normalize(str) {
            return str.trim().toLowerCase().replace(/\s+/g, '');
        }

        function checkCity() {
            const input = document.getElementById('city-input').value.trim();

            if (input.toLowerCase() === ADMIN_PASSWORD.toLowerCase()) {
                alert('Админ-панель недоступна здесь');
                return;
            }

            userCity = input;
            if (!userCity) return alert('Введите город');

            hideAll();
            const normalizedUser = normalize(userCity);

            let foundKey = null;
            for (let key in config.slots) {
                if (normalize(key) === normalizedUser && config.slots[key].length > 0) {
                    foundKey = key;
                    break;
                }
            }

            if (foundKey) {
                currentType = 'offline';
                currentKey = foundKey;
                showMessage('Поздравляем! 🎉 В твоём городе есть оффлайн-сессия!', 'congrats');
                showSlots(foundKey);
            } else {
                showMessage('Пока что в твоём городе нет оффлайн-сессии 😔', 'no-offline');
                document.getElementById('online-btn').style.display = 'block';
                document.getElementById('online-btn').onclick = showOnlineSlots;
            }
        }

        function showOnlineSlots() {
            currentType = 'online';
            currentKey = 'online';
            hideAll();
            showSlots('online');
        }

        function showSlots(key) {
            const slots = config.slots[key] || [];
            const list = document.getElementById('slots-list');
            list.innerHTML = '';

            if (slots.length === 0) {
                list.innerHTML = '<p style="font-size:22px;color:#95a5a6;">Нет доступных слотов</p>';
                document.getElementById('slots-container').style.display = 'block';
                return;
            }

            slots.forEach(slot => {
                const card = document.createElement('div');
                card.className = 'slot-card';
                const d = new Date(slot);
                const dateStr = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
                const timeStr = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                card.innerHTML = `
                    <div class="slot-date">${dateStr}</div>
                    <div class="slot-time">${timeStr}</div>
                `;
                card.onclick = () => {
                    selectedSlot = slot;
                    document.getElementById('selected-slot').textContent = `${dateStr} в ${timeStr}`;
                    document.getElementById('booking-form').style.display = 'block';
                    document.getElementById('full_name').focus();
                };
                list.appendChild(card);
            });

            document.getElementById('slots-container').style.display = 'block';
        }

        async function submitBooking() {
            const full_name = document.getElementById('full_name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();

            if (!full_name || !phone) {
                showMessage('Заполните обязательные поля!', 'error');
                return;
            }

            config.slots[currentKey] = config.slots[currentKey].filter(s => s !== selectedSlot);
            if (config.slots[currentKey].length === 0) delete config.slots[currentKey];
            await saveConfig();

            const d = new Date(selectedSlot);
            const dateStr = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
            const timeStr = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            const formattedSlot = `${dateStr} в ${timeStr}`;

            const formData = new FormData();
            formData.append('type', currentType === 'online' ? 'Онлайн' : 'Оффлайн');
            formData.append('city', currentType === 'online' ? 'Онлайн' : userCity);
            formData.append('slot', selectedSlot);
            formData.append('full_name', full_name);
            formData.append('phone', phone);
            formData.append('email', email || '-');
            formData.append('timestamp', new Date().toISOString());

            fetch(RECORDS_SCRIPT_URL, { method: 'POST', body: formData })
                .then(response => {
                    if (response.ok) {
                        document.getElementById('confirm-slot').textContent = formattedSlot;
                        document.getElementById('confirm-name').textContent = full_name;
                        document.getElementById('confirm-phone').textContent = phone;
                        document.getElementById('confirm-email').textContent = email || 'не указан';
                        document.getElementById('confirmation-modal').style.display = 'flex';
                        document.getElementById('booking-form').style.display = 'none';
                        currentType === 'online' ? showOnlineSlots() : checkCity();
                    } else {
                        alert('Ошибка отправки');
                    }
                })
                .catch(() => alert('Ошибка сети'));
        }

        function closeConfirmation() {
            document.getElementById('confirmation-modal').style.display = 'none';
        }

        function showMessage(text, type) {
            const msg = document.getElementById('result-message');
            msg.innerHTML = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
        }

        function hideAll() {
            document.getElementById('result-message').style.display = 'none';
            document.getElementById('online-btn').style.display = 'none';
            document.getElementById('slots-container').style.display = 'none';
            document.getElementById('booking-form').style.display = 'none';
        }
    </script>
</body>
</html>
