<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на сессию</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 50px 40px;
            text-align: center;
        }
        h1 {
            font-size: 36px;
            color: #2c3e50;
            margin-bottom: 40px;
            font-weight: 700;
        }
        label {
            display: block;
            margin: 25px 0 10px;
            font-weight: 600;
            color: #34495e;
            font-size: 18px;
            text-align: left;
        }
        input[type="text"] {
            width: 100%;
            padding: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            font-size: 18px;
            box-sizing: border-box;
        }
        button {
            padding: 18px 32px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 5px;
            box-shadow: 0 8px 20px rgba(52,152,219,0.2);
        }
        button:hover {
            background: #2980b9;
            transform: translateY(-3px);
        }
        .message {
            padding: 30px;
            border-radius: 20px;
            margin: 40px 0;
            font-size: 22px;
            font-weight: 600;
            line-height: 1.6;
        }
        .congrats { background: linear-gradient(135deg, #d5f5e3, #a8e6cf); color: #27ae60; }
        .no-offline { background: linear-gradient(135deg, #fffacd, #ffeb99); color: #f39c12; }
        .success { background: linear-gradient(135deg, #d4edda, #c3e6cb); color: #155724; font-size: 28px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }

        /* Календарь */
        #calendar-container {
            display: none;
            margin-top: 50px;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 700;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            text-align: center;
        }
        .calendar-day-name {
            font-weight: 600;
            color: #34495e;
            padding: 10px;
        }
        .calendar-day {
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        .calendar-day:hover {
            background: #e0e7ff;
            transform: scale(1.05);
        }
        .calendar-day.has-slots {
            background: #d0ebff;
            border: 2px solid #3498db;
            font-weight: 700;
        }
        .calendar-day.selected {
            background: #3498db;
            color: white;
        }
        .calendar-day.other-month {
            color: #bdc3c7;
        }
        #time-slots {
            margin-top: 40px;
            display: none;
        }
        .time-slot-btn {
            display: inline-block;
            padding: 15px 25px;
            margin: 10px;
            background: #e8f4fd;
            border: 2px solid #3498db;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .time-slot-btn:hover {
            background: #3498db;
            color: white;
            transform: translateY(-5px);
        }
        #booking-form {
            display: none;
            margin-top: 70px;
            padding: 50px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        #admin-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
            box-sizing: border-box;
        }
        #admin-content {
            background: white;
            border-radius: 24px;
            padding: 50px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }
        #admin-back {
            position: absolute;
            top: 30px;
            left: 30px;
            background: #e74c3c;
            padding: 15px 30px;
            font-size: 18px;
        }
        .admin-group {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container" id="user-container">
        <h1>🎯 Запись на сессию</h1>

        <label for="city-input">В каком городе вы находитесь?</label>
        <input type="text" id="city-input" placeholder="Например: Москва, Уфа, Казань">

        <button onclick="checkCity()">Проверить наличие сессии</button>

        <div id="result-message" class="message" style="display:none;"></div>

        <div id="calendar-container">
            <div class="calendar-header">
                <button onclick="prevMonth()">←</button>
                <span id="month-year"></span>
                <button onclick="nextMonth()">→</button>
            </div>
            <div class="calendar-grid">
                <div class="calendar-day-name">Пн</div>
                <div class="calendar-day-name">Вт</div>
                <div class="calendar-day-name">Ср</div>
                <div class="calendar-day-name">Чт</div>
                <div class="calendar-day-name">Пт</div>
                <div class="calendar-day-name">Сб</div>
                <div class="calendar-day-name">Вс</div>
            </div>
            <div id="calendar-days" class="calendar-grid"></div>

            <div id="time-slots">
                <h3>Выберите время на <span id="selected-date-text"></span></h3>
                <div id="time-buttons"></div>
            </div>
        </div>

        <div id="booking-form">
            <h3>Запись на <span id="selected-slot"></span></h3>
            
            <label for="full_name">Имя и фамилия *</label>
            <input type="text" id="full_name" placeholder="Иванов Иван">

            <label for="phone">Телефон *</label>
            <input type="tel" id="phone" placeholder="+7 (999) 123-45-67">

            <label for="email">Email (не обязательно)</label>
            <input type="email" id="email" placeholder="example@mail.ru">

            <button onclick="submitBooking()">Записаться</button>
        </div>
    </div>

    <!-- Админ-панель (остаётся прежней) -->
    <div id="admin-fullscreen">
        <div id="admin-content">
            <button id="admin-back" onclick="closeAdminFullscreen()">← Назад</button>
            <h2 style="margin-top:0;">Админ-панель</h2>

            <div class="admin-group">
                <label>Тип сессии</label>
                <select id="admin-type">
                    <option value="offline">Оффлайн (по городу)</option>
                    <option value="online">Онлайн-сессия</option>
                </select>
            </div>

            <div class="admin-group">
                <label>Город (для оффлайн)</label>
                <input type="text" id="admin-city" placeholder="Москва">
            </div>

            <div class="admin-group">
                <label>Начало серии</label>
                <input type="datetime-local" id="admin-start">
            </div>

            <div class="admin-group">
                <label>Конец серии</label>
                <input type="datetime-local" id="admin-end">
            </div>

            <div class="admin-group">
                <label>Интервал между слотами (минут)</label>
                <select id="admin-interval-minutes">
                    <option value="80">80 минут (1 сессия = 1:20)</option>
                    <option value="90">90 минут</option>
                    <option value="60">60 минут</option>
                    <option value="120">120 минут</option>
                    <option value="30">30 минут</option>
                </select>
            </div>

            <button onclick="addIntervalSlots()">Добавить серию слотов</button>

            <div class="admin-group">
                <label>Одиночный слот</label>
                <input type="datetime-local" id="admin-single">
                <button onclick="addSingleSlot()">Добавить один слот</button>
            </div>

            <button onclick="listAllSlots()">Показать все слоты</button>
            <div id="admin-slots-list" style="margin-top:30px; font-size:15px;"></div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'admin123';
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwgF7ZgsAGLSltO33bK_GTD-gyVu28RjDjLwYwAg5Z28oQFK5oC36vRxcxO7jTZ_tHzMw/exec';

        const SLOTS_SHEET_ID = '1Bqq3D0D1FBksioxcNIEQZbQyBXTKfj_KGW_bjpewCFw';

        let config = { slots: { online: [] } };

        let currentMonth = new Date();
        let selectedDate = null;

        async function loadConfig() {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SLOTS_SHEET_ID}/gviz/tq?tqx=out:json&sheet=Лист1`;
                const response = await fetch(url);
                const text = await response.text();
                const jsonMatch = text.match(/google.visualization.Query.setResponse\(([\s\S]*)\);/);
                if (jsonMatch && jsonMatch[1]) {
                    const data = JSON.parse(jsonMatch[1]);
                    const rows = data.table.rows;
                    if (rows.length > 0 && rows[0].c && rows[0].c[0] && rows[0].c[0].v) {
                        config = JSON.parse(rows[0].c[0].v);
                    }
                }
            } catch (e) {
                console.log('Ошибка загрузки слотов');
            }
        }

        async function saveConfig() {
            const formData = new FormData();
            formData.append('action', 'saveSlots');
            formData.append('data', JSON.stringify(config));

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: formData });
                if (!response.ok) throw new Error();
            } catch (e) {
                alert('Ошибка сохранения слотов');
            }
        }

        loadConfig();

        let userCity = '';
        let currentType = '';
        let currentKey = '';
        let selectedSlot = null;

        function normalize(str) {
            return str.trim().toLowerCase().replace(/\s+/g, '');
        }

        function checkCity() {
            const input = document.getElementById('city-input').value.trim();

            if (input.toLowerCase() === ADMIN_PASSWORD.toLowerCase()) {
                document.getElementById('user-container').style.display = 'none';
                document.getElementById('admin-fullscreen').style.display = 'flex';
                listAllSlots();
                return;
            }

            userCity = input;
            if (!userCity) return alert('Введите город');

            hideAll();
            const normalizedUser = normalize(userCity);

            let foundKey = null;
            for (let key in config.slots) {
                if (normalize(key) === normalizedUser && config.slots[key].length > 0) {
                    foundKey = key;
                    break;
                }
            }

            if (foundKey) {
                currentType = 'offline';
                currentKey = foundKey;
                document.getElementById('calendar-container').style.display = 'block';
                renderCalendar();
            } else {
                showMessage('Пока что в твоём городе нет оффлайн-сессии 😔', 'no-offline');
                document.getElementById('online-btn').style.display = 'block';
                document.getElementById('online-btn').onclick = () => {
                    currentType = 'online';
                    currentKey = 'online';
                    document.getElementById('calendar-container').style.display = 'block';
                    renderCalendar();
                };
            }
        }

        function renderCalendar() {
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();

            document.getElementById('month-year').textContent = currentMonth.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            const daysGrid = document.getElementById('calendar-days');
            daysGrid.innerHTML = '';

            // Дни предыдущего месяца
            const startDay = firstDay === 0 ? 6 : firstDay - 1;
            for (let i = startDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                const div = document.createElement('div');
                div.className = 'calendar-day other-month';
                div.textContent = day;
                daysGrid.appendChild(div);
            }

            // Дни текущего месяца
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasSlots = config.slots[currentKey]?.some(s => s.startsWith(dateStr));

                const div = document.createElement('div');
                div.className = 'calendar-day' + (hasSlots ? ' has-slots' : '');
                div.textContent = day;
                div.onclick = () => selectDay(dateStr);
                daysGrid.appendChild(div);
            }

            // Дни следующего месяца
            const totalCells = daysGrid.children.length;
            const remaining = 42 - totalCells;
            for (let day = 1; day <= remaining; day++) {
                const div = document.createElement('div');
                div.className = 'calendar-day other-month';
                div.textContent = day;
                daysGrid.appendChild(div);
            }
        }

        function selectDay(dateStr) {
            selectedDate = dateStr;
            document.getElementById('selected-date-text').textContent = new Date(dateStr).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

            const timeButtons = document.getElementById('time-buttons');
            timeButtons.innerHTML = '';

            const daySlots = config.slots[currentKey]?.filter(s => s.startsWith(dateStr)) || [];

            if (daySlots.length === 0) {
                timeButtons.innerHTML = '<p>Нет доступного времени на этот день</p>';
            } else {
                daySlots.forEach(slot => {
                    const time = slot.slice(11, 16);
                    const btn = document.createElement('button');
                    btn.className = 'time-slot-btn';
                    btn.textContent = time;
                    btn.onclick = () => {
                        selectedSlot = slot;
                        const d = new Date(slot);
                        const formatted = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }) + ' в ' + time;
                        document.getElementById('selected-slot').textContent = formatted;
                        document.getElementById('booking-form').style.display = 'block';
                        document.getElementById('full_name').focus();
                    };
                    timeButtons.appendChild(btn);
                });
            }

            document.getElementById('time-slots').style.display = 'block';
        }

        function prevMonth() {
            currentMonth.setMonth(currentMonth.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentMonth.setMonth(currentMonth.getMonth() + 1);
            renderCalendar();
        }

        // Остальные функции (submitBooking, админка, saveConfig и т.д.) — остаются прежними из предыдущей версии

        // ... (вставь функции submitBooking, closeAdminFullscreen, addSingleSlot, addIntervalSlots, listAllSlots, removeSlot, showMessage, hideAll из предыдущего кода)

    </script>
</body>
</html>
