<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #fff; margin: 0; }
        .card { max-width: 400px; margin: auto; }
        input, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        button { background: #2563eb; color: #fff; border: none; font-weight: bold; cursor: pointer; }
        .slot { background: #f0f4ff; padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; border-left: 5px solid #2563eb; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div id="scr-1" class="card">
    <input type="text" id="city-in" placeholder="Введите город">
    <button onclick="nav()">Показать время</button>
</div>
<div id="scr-2" class="card hidden">
    <div id="list"></div>
    <button onclick="location.reload()" style="background:#6c757d">Назад</button>
</div>
<div id="scr-3" class="card hidden">
    <input type="text" id="u-name" placeholder="Ваше Имя">
    <input type="tel" id="u-phone" placeholder="Ваш Телефон">
    <button onclick="send()">ЗАПИСАТЬСЯ</button>
</div>
<div id="scr-admin" class="card hidden">
    <input type="text" id="a-city" placeholder="Город"><input type="datetime-local" id="a-date">
    <button onclick="add()">Добавить</button>
</div>

<script>
    const API = 'https://script.google.com/macros/s/AKfycbw-E7qd71gezFw2B5_QaPiUhst26ZYY7Ek3vSTj8YzboEls2zXDqmaFpqG6mrZ88GeaMA/exec';
    const tg = window.Telegram.WebApp;
    let db = []; let sel = null;

    fetch(API).then(r => r.json()).then(d => { db = d; });

    function nav() {
        const c = document.getElementById('city-in').value.trim();
        if (c.toLowerCase() === 'admin123') {
            document.getElementById('scr-1').classList.add('hidden');
            document.getElementById('scr-admin').classList.remove('hidden');
            return;
        }
        const found = db.filter(x => x.city.toLowerCase() === c.toLowerCase());
        document.getElementById('scr-1').classList.add('hidden');
        document.getElementById('scr-2').classList.remove('hidden');
        const list = document.getElementById('list');
        list.innerHTML = found.length ? "" : "Мест нет";
        found.forEach(s => {
            const div = document.createElement('div'); div.className = 'slot'; div.innerText = s.date;
            div.onclick = () => { sel = s; document.getElementById('scr-2').classList.add('hidden'); document.getElementById('scr-3').classList.remove('hidden'); };
            list.appendChild(div);
        });
    }

    async function send() {
        const name = document.getElementById('u-name').value;
        const phone = document.getElementById('u-phone').value;
        if(!name || !phone) return alert("Заполните поля");
        await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'book', slot: sel.date, city: sel.city, name: name, phone: phone, tg_id: tg.initDataUnsafe?.user?.id || 0 })});
        tg.sendData("ЗаявкаОформлена"); // Ключевой сигнал для бота
        tg.close();
    }

    function add() {
        const c = document.getElementById('a-city').value; const d = document.getElementById('a-date').value;
        const ds = new Date(d).toLocaleString('ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});
        fetch(API, { method: 'POST', body: JSON.stringify({ action: 'addSlot', city: c, date: ds })});
        alert("Добавлено");
    }
</script>
</body>
</html>
