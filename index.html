<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на сессию</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); margin: 0; padding: 20px; min-height: 100vh; }
        .container { max-width: 900px; margin: 40px auto; background: white; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); padding: 50px 40px; text-align: center; }
        h1 { font-size: 36px; color: #2c3e50; margin-bottom: 40px; font-weight: 700; }
        label { display: block; margin: 25px 0 10px; font-weight: 600; color: #34495e; font-size: 18px; text-align: left; }
        input, select { width: 100%; padding: 18px; border: 2px solid #e0e0e0; border-radius: 16px; font-size: 18px; box-sizing: border-box; }
        button { padding: 18px 32px; background: #3498db; color: white; border: none; border-radius: 16px; font-size: 18px; font-weight: 600; cursor: pointer; margin: 10px 5px; transition: 0.3s; }
        button:hover { background: #2980b9; transform: translateY(-3px); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-top: 20px; }
        .calendar-day { padding: 15px; border-radius: 12px; cursor: pointer; background: #f8f9fa; }
        .calendar-day.has-slots { background: #d0ebff; border: 2px solid #3498db; font-weight: 700; }
        .hidden { display: none; }
        .message { padding: 30px; border-radius: 20px; margin: 40px 0; font-size: 20px; font-weight: 600; }
        .congrats { background: #d5f5e3; color: #27ae60; }
        .no-offline { background: #fffacd; color: #f39c12; }
        #admin-fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: white; z-index: 10000; padding: 40px; box-sizing: border-box; overflow-y: auto; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Запись на сессию</h1>

        <div id="step-city">
            <label>В каком городе вы находитесь?</label>
            <input type="text" id="city-input" placeholder="Например: Астана">
            <button onclick="checkCity()">Проверить наличие сессии</button>
        </div>

        <div id="result-message" class="message hidden"></div>
        <button id="online-btn" class="hidden" style="background: #27ae60; width: 100%;">Записаться на онлайн-сессию</button>

        <div id="calendar-container" class="hidden">
            <div style="display:flex; justify-content: space-between; align-items: center;">
                <button onclick="prevMonth()">←</button>
                <h3 id="month-year"></h3>
                <button onclick="nextMonth()">→</button>
            </div>
            <div class="calendar-grid" id="calendar-days"></div>
            
            <div id="time-slots" class="hidden" style="margin-top:30px;">
                <h3>Доступное время:</h3>
                <div id="time-buttons"></div>
            </div>
        </div>

        <div id="booking-form" class="hidden" style="margin-top: 50px; background: #f8f9fa; padding: 30px; border-radius: 20px;">
            <h3 id="selected-slot-text"></h3>
            <input type="text" id="full_name" placeholder="Имя и фамилия *">
            <input type="tel" id="phone" placeholder="Телефон *">
            <button onclick="submitBooking()" style="width: 100%; margin-top: 20px;">Записаться</button>
        </div>
    </div>

    <div id="admin-fullscreen">
        <button onclick="closeAdmin()" style="background:#e74c3c">← Назад</button>
        <h2>Админ-панель</h2>
        <label>Тип сессии</label>
        <select id="admin-type"><option value="offline">Оффлайн</option><option value="online">Онлайн</option></select>
        <label>Город</label>
        <input type="text" id="admin-city" placeholder="Москва">
        <label>Начало серии</label>
        <input type="datetime-local" id="admin-start">
        <label>Конец серии</label>
        <input type="datetime-local" id="admin-end">
        <label>Интервал (мин)</label>
        <select id="admin-interval"><option value="80">80 мин</option><option value="60">60 мин</option></select>
        <button onclick="addIntervalSlots()" style="width: 100%; margin-top: 20px;">Добавить слоты</button>
        <div id="admin-slots-list" style="margin-top: 40px; text-align: left;"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ЗАМЕНИТЕ ЭТУ ССЫЛКУ НА ВАШУ
        const GOOGLE_URL = 'https://script.google.com/macros/s/AKfycbyHkam9x1vURERQPYSc6zVlYdxoXEBY8zc8mdgtK9LhPSf7_EC-09K3Nb9mORAolzwcNg/exec';
        
        const ADMIN_PASS = 'admin123';
        let config = { slots: {} };
        let currentMonth = new Date();
        let userCity = '';
        let currentKey = '';
        let selectedSlot = null;

        async function loadConfig() {
            try {
                const response = await fetch(`${GOOGLE_URL}?action=getSlots`);
                config = await response.json();
            } catch (e) { console.error("Ошибка загрузки данных"); }
        }
        loadConfig();

        function checkCity() {
            const input = document.getElementById('city-input').value.trim();
            if (input === ADMIN_PASS) {
                document.getElementById('admin-fullscreen').style.display = 'block';
                listAdminSlots();
                return;
            }
            userCity = input;
            const normalized = input.toLowerCase().replace(/\s+/g, '');
            let foundKey = Object.keys(config.slots).find(k => k.toLowerCase().replace(/\s+/g, '') === normalized);

            if (foundKey && config.slots[foundKey].length > 0) {
                currentKey = foundKey;
                showMsg('Поздравляем! 🎉 В твоём городе есть сессии!', 'congrats');
                document.getElementById('calendar-container').classList.remove('hidden');
                renderCalendar();
            } else {
                showMsg('Пока что в твоём городе нет оффлайн-сессии 😔', 'no-offline');
                document.getElementById('online-btn').classList.remove('hidden');
            }
        }

        document.getElementById('online-btn').onclick = () => {
            currentKey = 'online';
            document.getElementById('calendar-container').classList.remove('hidden');
            renderCalendar();
        };

        function renderCalendar() {
            const daysGrid = document.getElementById('calendar-days');
            daysGrid.innerHTML = '';
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            document.getElementById('month-year').textContent = currentMonth.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const hasSlots = config.slots[currentKey]?.some(s => s.startsWith(dateStr));
                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day' + (hasSlots ? ' has-slots' : '');
                dayDiv.textContent = i;
                if (hasSlots) dayDiv.onclick = () => showTimes(dateStr);
                daysGrid.appendChild(dayDiv);
            }
        }

        function showTimes(date) {
            const container = document.getElementById('time-buttons');
            container.innerHTML = '';
            const slots = config.slots[currentKey].filter(s => s.startsWith(date));
            slots.forEach(s => {
                const btn = document.createElement('button');
                btn.textContent = s.split('T')[1];
                btn.onclick = () => {
                    selectedSlot = s;
                    document.getElementById('selected-slot-text').textContent = "Запись на " + s.replace('T', ' ');
                    document.getElementById('booking-form').classList.remove('hidden');
                };
                container.appendChild(btn);
            });
            document.getElementById('time-slots').classList.remove('hidden');
        }

        async function submitBooking() {
            const name = document.getElementById('full_name').value;
            const phone = document.getElementById('phone').value;
            if (!name || !phone) return alert("Заполните поля!");

            const fd = new FormData();
            fd.append('type', currentKey === 'online' ? 'Онлайн' : 'Оффлайн');
            fd.append('city', currentKey);
            fd.append('slot', selectedSlot);
            fd.append('full_name', name);
            fd.append('phone', phone);

            // 1. Отправляем запись в таблицу
            await fetch(GOOGLE_URL, { method: 'POST', body: fd, mode: 'no-cors' });

            // 2. Удаляем слот и сохраняем конфиг
            config.slots[currentKey] = config.slots[currentKey].filter(s => s !== selectedSlot);
            const saveFd = new FormData();
            saveFd.append('action', 'saveSlots');
            saveFd.append('data', JSON.stringify(config));
            await fetch(GOOGLE_URL, { method: 'POST', body: saveFd, mode: 'no-cors' });

            // 3. Сигнал боту и закрытие
            tg.sendData("ЗаявкаОформлена");
            tg.close();
        }

        async function addIntervalSlots() {
            const type = document.getElementById('admin-type').value;
            const city = document.getElementById('admin-city').value;
            const start = new Date(document.getElementById('admin-start').value);
            const end = new Date(document.getElementById('admin-end').value);
            const interval = parseInt(document.getElementById('admin-interval').value);
            
            const key = type === 'online' ? 'online' : city;
            if (!config.slots[key]) config.slots[key] = [];

            let curr = start;
            while (curr <= end) {
                config.slots[key].push(curr.toISOString().slice(0, 16));
                curr = new Date(curr.getTime() + interval * 60000);
            }
            
            const fd = new FormData();
            fd.append('action', 'saveSlots');
            fd.append('data', JSON.stringify(config));
            await fetch(GOOGLE_URL, { method: 'POST', body: fd, mode: 'no-cors' });
            alert("Слоты добавлены!");
            listAdminSlots();
        }

        function listAdminSlots() {
            const div = document.getElementById('admin-slots-list');
            div.innerHTML = '<h3>Текущие слоты:</h3>';
            for (let k in config.slots) {
                config.slots[k].forEach(s => {
                    div.innerHTML += `<div>${k}: ${s}</div>`;
                });
            }
        }

        function showMsg(t, c) {
            const m = document.getElementById('result-message');
            m.textContent = t; m.className = 'message ' + c; m.classList.remove('hidden');
        }
        function closeAdmin() { document.getElementById('admin-fullscreen').style.display = 'none'; }
        function prevMonth() { currentMonth.setMonth(currentMonth.getMonth() - 1); renderCalendar(); }
        function nextMonth() { currentMonth.setMonth(currentMonth.getMonth() + 1); renderCalendar(); }
    </script>
</body>
</html>
